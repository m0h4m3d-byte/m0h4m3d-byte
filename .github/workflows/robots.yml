name: Generate Robots Battle

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # هذا السطر يمنح الصلاحيات اللازمة

    steps:
      - uses: actions/checkout@v4  # ترقية إلى الإصدار 4
      
      - name: Generate Robots SVG
        run: |
          mkdir -p dist
          cat > dist/robots-battle.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
            <style>
              @keyframes robot1Move {
                0% { transform: translateX(0) rotate(0deg); }
                25% { transform: translateX(30px) rotate(-3deg); }
                50% { transform: translateX(60px) rotate(0deg); }
                75% { transform: translateX(30px) rotate(3deg); }
                100% { transform: translateX(0) rotate(0deg); }
              }
              @keyframes robot2Move {
                0% { transform: translateX(0) rotate(0deg); }
                25% { transform: translateX(-30px) rotate(3deg); }
                50% { transform: translateX(-60px) rotate(0deg); }
                75% { transform: translateX(-30px) rotate(-3deg); }
                100% { transform: translateX(0) rotate(0deg); }
              }
              @keyframes swordSwing1 {
                0% { transform: rotate(-30deg); }
                50% { transform: rotate(30deg); }
                100% { transform: rotate(-30deg); }
              }
              @keyframes swordSwing2 {
                0% { transform: rotate(30deg); }
                50% { transform: rotate(-30deg); }
                100% { transform: rotate(30deg); }
              }
              @keyframes laserBeam {
                0% { opacity: 1; stroke-width: 4; }
                50% { opacity: 0.3; stroke-width: 8; }
                100% { opacity: 1; stroke-width: 4; }
              }
              @keyframes bigExplosion {
                0% { transform: scale(0.5); opacity: 0; }
                20% { opacity: 1; }
                80% { opacity: 1; }
                100% { transform: scale(1.5); opacity: 0; }
              }
              @keyframes sparkle {
                0% { opacity: 1; transform: scale(1); }
                100% { opacity: 0; transform: scale(2); }
              }
              @keyframes energyShield {
                0% { stroke-dashoffset: 0; }
                100% { stroke-dashoffset: 100; }
              }
              @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }
                100% { transform: translateY(0px); }
              }
              @keyframes glow {
                0% { filter: drop-shadow(0 0 5px #ffcc00); }
                50% { filter: drop-shadow(0 0 20px #ff6b6b); }
                100% { filter: drop-shadow(0 0 5px #ffcc00); }
              }
              
              .robot1 { animation: robot1Move 3s ease-in-out infinite; }
              .robot2 { animation: robot2Move 3s ease-in-out infinite; }
              .sword1 { animation: swordSwing1 0.8s ease-in-out infinite; transform-origin: 75px 60px; }
              .sword2 { animation: swordSwing2 0.8s ease-in-out infinite; transform-origin: -35px 60px; }
              .laser { animation: laserBeam 0.3s ease-in-out infinite; }
              .explosion { animation: bigExplosion 1.5s ease-in-out infinite; transform-origin: center; }
              .spark { animation: sparkle 0.6s ease-in-out infinite; }
              .shield { animation: energyShield 2s linear infinite; }
              .float { animation: float 2s ease-in-out infinite; }
              .winner-glow { animation: glow 1.5s ease-in-out infinite; }
            </style>
            
            <defs>
              <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#1a1a2e" stop-opacity="1"/>
                <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
              </radialGradient>
            </defs>
            <rect width="1000" height="300" fill="url(#bgGlow)" rx="10"/>
            
            <g opacity="0.15">
              <rect x="30" y="20" width="15" height="15" fill="#39d353"/>
              <rect x="50" y="20" width="15" height="15" fill="#2ea043"/>
              <rect x="70" y="20" width="15" height="15" fill="#39d353"/>
              <rect x="90" y="20" width="15" height="15" fill="#1a7f37"/>
              <rect x="110" y="20" width="15" height="15" fill="#39d353"/>
              <rect x="150" y="40" width="15" height="15" fill="#2ea043"/>
              <rect x="170" y="40" width="15" height="15" fill="#39d353"/>
              <rect x="190" y="40" width="15" height="15" fill="#1a7f37"/>
              <rect x="210" y="40" width="15" height="15" fill="#39d353"/>
              <rect x="250" y="60" width="15" height="15" fill="#39d353"/>
              <rect x="270" y="60" width="15" height="15" fill="#2ea043"/>
              <rect x="310" y="80" width="15" height="15" fill="#1a7f37"/>
              <rect x="330" y="80" width="15" height="15" fill="#39d353"/>
              <rect x="350" y="80" width="15" height="15" fill="#2ea043"/>
              <rect x="400" y="100" width="15" height="15" fill="#39d353"/>
              <rect x="420" y="100" width="15" height="15" fill="#1a7f37"/>
              <rect x="440" y="100" width="15" height="15" fill="#39d353"/>
              <rect x="480" y="120" width="15" height="15" fill="#2ea043"/>
              <rect x="500" y="120" width="15" height="15" fill="#39d353"/>
              <rect x="530" y="140" width="15" height="15" fill="#39d353"/>
              <rect x="550" y="140" width="15" height="15" fill="#1a7f37"/>
              <rect x="570" y="140" width="15" height="15" fill="#2ea043"/>
              <rect x="610" y="160" width="15" height="15" fill="#39d353"/>
              <rect x="630" y="160" width="15" height="15" fill="#39d353"/>
              <rect x="660" y="180" width="15" height="15" fill="#2ea043"/>
              <rect x="680" y="180" width="15" height="15" fill="#39d353"/>
              <rect x="710" y="200" width="15" height="15" fill="#1a7f37"/>
              <rect x="730" y="200" width="15" height="15" fill="#39d353"/>
              <rect x="760" y="220" width="15" height="15" fill="#2ea043"/>
              <rect x="780" y="220" width="15" height="15" fill="#39d353"/>
              <rect x="820" y="240" width="15" height="15" fill="#39d353"/>
              <rect x="840" y="240" width="15" height="15" fill="#1a7f37"/>
              <rect x="870" y="260" width="15" height="15" fill="#2ea043"/>
              <rect x="890" y="260" width="15" height="15" fill="#39d353"/>
            </g>
            
            <!-- الروبوت 1 -->
            <g class="robot1 float" transform="translate(150, 40)">
              <rect x="20" y="50" width="70" height="90" rx="8" fill="#1a73e8" stroke="#0d47a1" stroke-width="3"/>
              <rect x="35" y="60" width="40" height="15" rx="3" fill="#4fc3f7" opacity="0.3"/>
              <rect x="35" y="85" width="40" height="30" rx="3" fill="#4fc3f7" opacity="0.2"/>
              <circle cx="55" cy="100" r="10" fill="#4fc3f7" opacity="0.4"/>
              <rect x="30" y="15" width="40" height="40" rx="10" fill="#1a73e8" stroke="#0d47a1" stroke-width="3"/>
              <circle cx="50" cy="35" r="12" fill="#4fc3f7" stroke="#0d47a1" stroke-width="2"/>
              <circle cx="50" cy="35" r="6" fill="#ffffff"/>
              <circle cx="48" cy="33" r="2" fill="#0d47a1"/>
              <path d="M 30 15 L 70 15 L 65 5 L 35 5 Z" fill="#0d47a1" opacity="0.6"/>
              <g class="sword1">
                <rect x="90" y="60" width="20" height="50" rx="5" fill="#1a73e8" stroke="#0d47a1" stroke-width="2"/>
                <rect x="95" y="-10" width="8" height="75" rx="4" fill="#4fc3f7" stroke="#00bcd4" stroke-width="2"/>
                <rect x="95" y="-20" width="8" height="15" rx="2" fill="#00bcd4" opacity="0.5"/>
                <ellipse cx="99" cy="-20" rx="15" ry="8" fill="#4fc3f7" opacity="0.3">
                  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.3s" repeatCount="indefinite"/>
                </ellipse>
              </g>
              <rect x="-10" y="60" width="20" height="50" rx="5" fill="#1a73e8" stroke="#0d47a1" stroke-width="2"/>
              <circle cx="0" cy="85" r="8" fill="#4fc3f7" opacity="0.5"/>
              <rect x="25" y="140" width="20" height="40" rx="5" fill="#1a73e8" stroke="#0d47a1" stroke-width="2"/>
              <rect x="45" y="140" width="20" height="40" rx="5" fill="#1a73e8" stroke="#0d47a1" stroke-width="2"/>
              <ellipse cx="35" cy="180" rx="15" ry="8" fill="#0d47a1" opacity="0.5"/>
              <ellipse cx="55" cy="180" rx="15" ry="8" fill="#0d47a1" opacity="0.5"/>
              <circle cx="55" cy="90" r="60" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.3" stroke-dasharray="10 5" class="shield"/>
            </g>
            
            <!-- الروبوت 2 -->
            <g class="robot2 float" transform="translate(630, 40)">
              <rect x="20" y="50" width="70" height="90" rx="8" fill="#e53935" stroke="#b71c1c" stroke-width="3"/>
              <rect x="35" y="60" width="40" height="15" rx="3" fill="#ff8a80" opacity="0.3"/>
              <rect x="35" y="85" width="40" height="30" rx="3" fill="#ff8a80" opacity="0.2"/>
              <circle cx="55" cy="100" r="10" fill="#ff8a80" opacity="0.4"/>
              <rect x="30" y="15" width="40" height="40" rx="10" fill="#e53935" stroke="#b71c1c" stroke-width="3"/>
              <circle cx="50" cy="35" r="12" fill="#ff8a80" stroke="#b71c1c" stroke-width="2"/>
              <circle cx="50" cy="35" r="6" fill="#ffffff"/>
              <circle cx="52" cy="33" r="2" fill="#b71c1c"/>
              <path d="M 30 15 L 70 15 L 75 5 L 25 5 Z" fill="#b71c1c" opacity="0.6"/>
              <path d="M 30 15 L 20 0 L 35 10" fill="#ff6b6b" stroke="#b71c1c" stroke-width="1"/>
              <path d="M 70 15 L 80 0 L 65 10" fill="#ff6b6b" stroke="#b71c1c" stroke-width="1"/>
              <g class="sword2">
                <rect x="-10" y="60" width="20" height="50" rx="5" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
                <rect x="-5" y="-10" width="8" height="75" rx="4" fill="#ff8a80" stroke="#ff6b6b" stroke-width="2"/>
                <rect x="-5" y="-20" width="8" height="15" rx="2" fill="#ff6b6b" opacity="0.5"/>
                <ellipse cx="-1" cy="-20" rx="15" ry="8" fill="#ff8a80" opacity="0.3">
                  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.3s" repeatCount="indefinite"/>
                </ellipse>
              </g>
              <rect x="90" y="60" width="20" height="50" rx="5" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
              <circle cx="100" cy="85" r="8" fill="#ff8a80" opacity="0.5"/>
              <rect x="25" y="140" width="20" height="40" rx="5" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
              <rect x="45" y="140" width="20" height="40" rx="5" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
              <ellipse cx="35" cy="180" rx="15" ry="8" fill="#b71c1c" opacity="0.5"/>
              <ellipse cx="55" cy="180" rx="15" ry="8" fill="#b71c1c" opacity="0.5"/>
              <circle cx="55" cy="90" r="60" fill="none" stroke="#ff8a80" stroke-width="2" opacity="0.3" stroke-dasharray="10 5" class="shield"/>
            </g>
            
            <!-- معركة الليزر -->
            <line x1="310" y1="130" x2="620" y2="140" stroke="#ff0000" stroke-width="5" opacity="0.9" class="laser"/>
            <line x1="310" y1="130" x2="620" y2="140" stroke="#ffcc00" stroke-width="3" opacity="0.7">
              <animate attributeName="opacity" values="0.7;0.2;0.7" dur="0.2s" repeatCount="indefinite"/>
            </line>
            <line x1="310" y1="130" x2="620" y2="140" stroke="#ffffff" stroke-width="1" opacity="0.5">
              <animate attributeName="opacity" values="0.5;0.1;0.5" dur="0.15s" repeatCount="indefinite"/>
            </line>
            
            <!-- انفجار -->
            <g class="explosion" transform="translate(480, 100)">
              <circle cx="0" cy="0" r="30" fill="#ffcc00" opacity="0.8"/>
              <circle cx="0" cy="0" r="20" fill="#ff6b6b" opacity="0.9"/>
              <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="1"/>
              <line x1="0" y1="-30" x2="0" y2="-60" stroke="#ffcc00" stroke-width="3" opacity="0.6">
                <animate attributeName="y2" values="-60;-80" dur="0.5s" repeatCount="indefinite"/>
              </line>
              <line x1="0" y1="30" x2="0" y2="60" stroke="#ffcc00" stroke-width="3" opacity="0.6">
                <animate attributeName="y2" values="60;80" dur="0.5s" repeatCount="indefinite"/>
              </line>
              <line x1="-30" y1="0" x2="-60" y2="0" stroke="#ffcc00" stroke-width="3" opacity="0.6">
                <animate attributeName="x2" values="-60;-80" dur="0.5s" repeatCount="indefinite"/>
              </line>
              <line x1="30" y1="0" x2="60" y2="0" stroke="#ffcc00" stroke-width="3" opacity="0.6">
                <animate attributeName="x2" values="60;80" dur="0.5s" repeatCount="indefinite"/>
              </line>
            </g>
            
            <!-- شرارات -->
            <g class="spark" transform="translate(400, 80)">
              <circle cx="0" cy="0" r="4" fill="#ffcc00"/>
              <circle cx="15" cy="-12" r="3" fill="#ff6b6b"/>
              <circle cx="-15" cy="-12" r="3" fill="#ff6b6b"/>
              <circle cx="10" cy="-25" r="2" fill="#ffcc00"/>
              <circle cx="-10" cy="-25" r="2" fill="#ffcc00"/>
              <circle cx="0" cy="-30" r="3" fill="#ffffff"/>
            </g>
            
            <!-- عنوان المعركة -->
            <g class="winner-glow" transform="translate(500, 25)">
              <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffd700" text-anchor="middle" stroke="#000" stroke-width="0.5">
                ⚔️ EPIC BATTLE ⚔️
              </text>
            </g>
          </svg>
          EOF
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/robots-battle.svg
          git diff --staged --quiet || (git commit -m "Update robots battle" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
