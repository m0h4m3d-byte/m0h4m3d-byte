name: Generate Robots Battle

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Robots SVG
        run: |
          mkdir -p dist
          cat > dist/robots-battle.svg << 'EOF'
          # هتنسخ كود الـ SVG وتلصقه هنا بدل السطر ده #
          EOF
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/robots-battle.svg
          git diff --staged --quiet || (git commit -m "Update robots battle" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
