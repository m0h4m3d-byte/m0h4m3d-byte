<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <style>
    @keyframes robot1Move {
      0%   { transform: translateX(-200px); }
      20%  { transform: translateX(0px); }
      25%  { transform: translateX(5px) rotate(-5deg); }
      30%  { transform: translateX(0px) rotate(0deg); }
      70%  { transform: translateX(0px); }
      100% { transform: translateX(-200px); }
    }
    @keyframes robot2Move {
      0%   { transform: translateX(200px); }
      20%  { transform: translateX(0px); }
      25%  { transform: translateX(-5px) rotate(5deg); }
      30%  { transform: translateX(0px) rotate(0deg); }
      70%  { transform: translateX(0px); }
      100% { transform: translateX(200px); }
    }
    @keyframes swordSwing1 {
      0% { transform: rotate(-30deg); }
      25% { transform: rotate(60deg); }
      50% { transform: rotate(-30deg); }
      100% { transform: rotate(-30deg); }
    }
    @keyframes swordSwing2 {
      0% { transform: rotate(30deg); }
      25% { transform: rotate(-60deg); }
      50% { transform: rotate(30deg); }
      100% { transform: rotate(30deg); }
    }
    @keyframes laserBeam {
      0%, 15% { opacity: 0; }
      20%, 60% { opacity: 1; stroke-width: 5; }
      70%, 100% { opacity: 0; }
    }
    @keyframes bigExplosion {
      0%, 15% { transform: scale(0); opacity: 0; }
      25%, 55% { transform: scale(1); opacity: 1; }
      70%, 100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 5px #ffcc00); }
      50% { filter: drop-shadow(0 0 20px #ff6b6b); }
    }
    .robot1 { animation: robot1Move 5s ease-in-out infinite; }
    .robot2 { animation: robot2Move 5s ease-in-out infinite; }
    .sword1 { animation: swordSwing1 0.5s ease-in-out infinite; transform-origin: 75px 60px; }
    .sword2 { animation: swordSwing2 0.5s ease-in-out infinite; transform-origin: -35px 60px; }
    .laser { animation: laserBeam 5s ease-in-out infinite; }
    .explosion { animation: bigExplosion 5s ease-in-out infinite; transform-origin: center; }
    .winner-glow { animation: glow 1.5s ease-in-out infinite; }
  </style>
  
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>
  
  <rect width="1000" height="300" fill="url(#bgGlow)" rx="10"/>
  
  <g opacity="0.15">
    <rect x="30" y="20" width="15" height="15" fill="#39d353"/><rect x="50" y="20" width="15" height="15" fill="#2ea043"/><rect x="70" y="20" width="15" height="15" fill="#39d353"/>
    <rect x="90" y="20" width="15" height="15" fill="#1a7f37"/><rect x="110" y="20" width="15" height="15" fill="#39d353"/><rect x="150" y="40" width="15" height="15" fill="#2ea043"/>
    <rect x="170" y="40" width="15" height="15" fill="#39d353"/><rect x="190" y="40" width="15" height="15" fill="#1a7f37"/><rect x="210" y="40" width="15" height="15" fill="#39d353"/>
    <rect x="250" y="60" width="15" height="15" fill="#39d353"/><rect x="270" y="60" width="15" height="15" fill="#2ea043"/><rect x="310" y="80" width="15" height="15" fill="#1a7f37"/>
    <rect x="330" y="80" width="15" height="15" fill="#39d353"/><rect x="350" y="80" width="15" height="15" fill="#2ea043"/><rect x="400" y="100" width="15" height="15" fill="#39d353"/>
    <rect x="420" y="100" width="15" height="15" fill="#1a7f37"/><rect x="440" y="100" width="15" height="15" fill="#39d353"/><rect x="480" y="120" width="15" height="15" fill="#2ea043"/>
    <rect x="500" y="120" width="15" height="15" fill="#39d353"/><rect x="530" y="140" width="15" height="15" fill="#39d353"/><rect x="550" y="140" width="15" height="15" fill="#1a7f37"/>
    <rect x="570" y="140" width="15" height="15" fill="#2ea043"/><rect x="610" y="160" width="15" height="15" fill="#39d353"/><rect x="630" y="160" width="15" height="15" fill="#39d353"/>
    <rect x="660" y="180" width="15" height="15" fill="#2ea043"/><rect x="680" y="180" width="15" height="15" fill="#39d353"/><rect x="710" y="200" width="15" height="15" fill="#1a7f37"/>
    <rect x="730" y="200" width="15" height="15" fill="#39d353"/><rect x="760" y="220" width="15" height="15" fill="#2ea043"/><rect x="780" y="220" width="15" height="15" fill="#39d353"/>
    <rect x="820" y="240" width="15" height="15" fill="#39d353"/><rect x="840" y="240" width="15" height="15" fill="#1a7f37"/><rect x="870" y="260" width="15" height="15" fill="#2ea043"/>
    <rect x="890" y="260" width="15" height="15" fill="#39d353"/>
  </g>

  <g class="winner-glow" transform="translate(500, 30)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffd700" text-anchor="middle" stroke="#000" stroke-width="0.5">⚔️ EPIC BATTLE ⚔️</text>
  </g>

  <g class="explosion" transform="translate(500, 150)">
    <circle cx="0" cy="0" r="30" fill="#ffcc00" opacity="0.9"/>
    <circle cx="0" cy="0" r="15" fill="#ff6b6b" opacity="1"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <line x1="380" y1="150" x2="620" y2="150" stroke="#ff0000" stroke-width="6" opacity="0.9" class="laser"/>

  <g class="robot1" transform="translate(180, 50)">
    <g class="sword1">
      <rect x="90" y="60" width="20" height="50" rx="5" fill="#1a73e8"/>
      <rect x="95" y="-10" width="8" height="75" rx="4" fill="#4fc3f7"/>
      <ellipse cx="99" cy="-20" rx="15" ry="8" fill="#4fc3f7" opacity="0.5"/>
    </g>
    <rect x="20" y="50" width="70" height="90" rx="8" fill="#1a73e8"/>
    <rect x="35" y="85" width="40" height="30" rx="3" fill="#4fc3f7" opacity="0.2"/>
    <circle cx="55" cy="100" r="10" fill="#4fc3f7" opacity="0.4"/>
    <rect x="30" y="15" width="40" height="40" rx="10" fill="#1a73e8"/>
    <circle cx="50" cy="35" r="12" fill="#4fc3f7"/>
    <circle cx="50" cy="35" r="6" fill="#ffffff"/>
    <circle cx="48" cy="33" r="2" fill="#0d47a1"/>
    <rect x="25" y="140" width="20" height="40" rx="5" fill="#1a73e8"/>
    <rect x="45" y="140" width="20" height="40" rx="5" fill="#1a73e8"/>
    <ellipse cx="35" cy="180" rx="15" ry="8" fill="#0d47a1" opacity="0.5"/>
    <ellipse cx="55" cy="180" rx="15" ry="8" fill="#0d47a1" opacity="0.5"/>
  </g>

  <g class="robot2" transform="translate(630, 50)">
    <g class="sword2">
      <rect x="-10" y="60" width="20" height="50" rx="5" fill="#e53935"/>
      <rect x="-5" y="-10" width="8" height="75" rx="4" fill="#ff8a80"/>
      <ellipse cx="-1" cy="-20" rx="15" ry="8" fill="#ff8a80" opacity="0.5"/>
    </g>
    <rect x="20" y="50" width="70" height="90" rx="8" fill="#e53935"/>
    <rect x="35" y="85" width="40" height="30" rx="3" fill="#ff8a80" opacity="0.2"/>
    <circle cx="55" cy="100" r="10" fill="#ff8a80" opacity="0.4"/>
    <rect x="30" y="15" width="40" height="40" rx="10" fill="#e53935"/>
    <circle cx="50" cy="35" r="12" fill="#ff8a80"/>
    <circle cx="50" cy="35" r="6" fill="#ffffff"/>
    <circle cx="52" cy="33" r="2" fill="#b71c1c"/>
    <rect x="25" y="140" width="20" height="40" rx="5" fill="#e53935"/>
    <rect x="45" y="140" width="20" height="40" rx="5" fill="#e53935"/>
    <ellipse cx="35" cy="180" rx="15" ry="8" fill="#b71c1c" opacity="0.5"/>
    <ellipse cx="55" cy="180" rx="15" ry="8" fill="#b71c1c" opacity="0.5"/>
  </g>
</svg>
